{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

{% set signup = request.args.get('mode') == 'signup' %}
<div class="login-page{{ ' is-signup' if signup else '' }}">
  <div class="auth-curves" aria-hidden="true"><span class="auth-curve auth-curve--one"></span><span class="auth-curve auth-curve--two"></span><span class="auth-curve auth-curve--three"></span></div>
  <div class="auth-shell">
    <section class="auth-card" id="authCard">
      <!-- Mode controls remain available at every viewport width. -->
      <div class="mobile-auth-tabs" aria-label="Switch between login and sign up">
        <button class="mobile-auth-tab" data-swap="login" type="button" aria-controls="login-pane" aria-pressed="{{ 'false' if signup else 'true' }}">Login</button>
        <button class="mobile-auth-tab" data-swap="signup" type="button" aria-controls="signup-pane" aria-pressed="{{ 'true' if signup else 'false' }}">Create Account</button>
      </div>

      <!-- Fixed side-by-side panes -->
      <div class="panes">
        <!-- LOGIN PANE -->
        <div class="pane pane-login" id="login-pane"{% if signup %} hidden inert{% endif %} aria-labelledby="login-title">
          <h1 id="login-title" class="title">Login</h1>
          <p class="subtitle">Sign in to your account</p>

          <form class="login-form" method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-row">
              <label for="username">Username</label>
              <input id="username" autocomplete="username" name="username" type="text" placeholder="Username" required
                     value="{{ request.form.get('username','') }}">
            </div>

            <div class="form-row">
              <div class="label-row">
                <label for="password">Password</label>
                <button class="ghost" type="button" id="togglePassword" aria-controls="password" aria-pressed="false">
                  Show
                </button>
              </div>
              <input id="password" autocomplete="current-password" name="password" type="password" placeholder="Password" required>
            </div>

            <div class="form-meta">
              <span></span>
              <a class="link" href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
            </div>

            <button class="primary-btn" type="submit">Login</button>
          </form>
        </div>

        <!-- SIGN-UP PANE (kept here so slide-over feels instant) -->
        <div class="pane pane-signup" id="signup-pane"{% if not signup %} hidden inert{% endif %} aria-labelledby="signup-title">
          <h1 id="signup-title" class="title">Create Account</h1>
          <p class="subtitle">Get started in seconds</p>

          <!-- If your register flow is a separate page, you can change action to url_for('auth.register') -->
          <form class="signup-form" method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-row">
              <label for="new_username">Username</label>
              <input id="new_username" autocomplete="username" name="username" type="text" placeholder="Choose a username" required>
            </div>

            <div class="form-row">
              <label for="email">Email</label>
              <input id="email" autocomplete="email" name="email" type="email" placeholder="you@example.com" required>
            </div>

            <div class="form-row">
              <div class="label-row">
                <label for="new_password">Password</label>
                <button class="ghost" type="button" id="togglePasswordSignup" aria-controls="new_password" aria-pressed="false">
                  Show
                </button>
              </div>
              <input id="new_password" autocomplete="new-password" name="password" type="password" placeholder="Create a password" required>
            </div>

            <button class="primary-btn" type="submit">Sign Up</button>
          </form>
        </div>
      </div>

    </section>
  </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
