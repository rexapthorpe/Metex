name: Flow of funds safety checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q core routes services utils
      - name: Check browser JavaScript syntax
        run: find static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smart Pricing browser behavior tests
        run: node --test tests/test_smart_pricing_ui.cjs
      - name: Build a clean test database schema
        env:
          FLASK_TESTING: "1"
        run: python -m scripts.create_schema
      - name: Run authoritative financial acceptance tests
        env:
          FLASK_TESTING: "1"
        run: >-
          pytest -q
          tests/test_flow_of_funds_acceptance.py
          tests/test_smart_pricing.py
          tests/test_launch_safety.py
          tests/test_storage_migration.py
          tests/test_retired_financial_commands.py
          tests/test_delivery_payout.py
          tests/test_routes_smoke.py
          tests/test_security.py
          tests/test_security_fixes.py
          tests/test_security_p0.py
          tests/test_security_pass2.py
          tests/test_spot_snapshot_scheduler.py
          tests/test_admin_reconciliation.py

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: metex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/metex_test
      FLASK_TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Fresh and repeat schema creation
        run: |
          python -m scripts.create_schema
          python -m scripts.create_schema
      - name: PostgreSQL inventory, payment, refund and transfer races
        run: pytest -q tests/test_postgres_launch_concurrency.py
