services:
  - type: web
    name: metex
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.create_schema && gunicorn "core:create_app()" --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    disk:
      name: metex-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metex-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BEHIND_PROXY
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: ENABLE_HSTS
        value: "true"
      - key: UPLOADS_ROOT
        value: /var/data/uploads
      - key: RATELIMIT_STORAGE_URL
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: TAX_CONFIGURATION_APPROVED
        value: "false"
      - key: FLASK_ENV
        value: production
      - key: SITE_URL
        value: https://metex.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Set these manually in the Render dashboard:
      # METALPRICE_API_KEY, EMAIL_ADDRESS, EMAIL_PASSWORD,
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET

databases:
  - name: metex-db
    plan: free
    databaseName: metex
    user: metex

# For reliable independent scheduling, provision a paid worker using
# python -m scripts.run_flow_worker and the same database/provider configuration.
# Set EMBEDDED_FLOW_WORKER=false on web only after worker heartbeat is verified.
# uploads disk and database need separately tested backup/restore.
